<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Becsületkassza</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
    }
    .card {
      background: white;
      border-radius: 32px;
      padding: 48px 40px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 0 #cc0000, 0 8px 0 #990000, 0 16px 40px rgba(204,0,0,0.15);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes popIn {
      from { transform: scale(0.7) translateY(30px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }
    .cup-img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      animation: wave 2s ease-in-out infinite;
      filter: drop-shadow(0 8px 16px rgba(204,0,0,0.2));
    }
    @keyframes wave {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50%       { transform: rotate(4deg) translateY(-8px); }
    }
    .org-name {
      font-family: 'Bangers', cursive;
      font-size: 2.4rem;
      letter-spacing: 2px;
      color: #cc0000;
      margin: 16px 0 4px;
      line-height: 1.1;
      text-shadow: 3px 3px 0 #ffcccc;
    }
    .tagline {
      font-size: 1rem;
      color: #888;
      margin-bottom: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    hr {
      border: none;
      border-top: 3px dashed #ffcccc;
      margin: 0 0 28px;
    }
    .account-box {
      background: #fff5f5;
      border: 3px solid #cc0000;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .account-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #cc0000;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .account-number {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      letter-spacing: 4px;
      color: #222;
    }
    .copy-btn {
      background: #cc0000;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      letter-spacing: 1px;
      transition: transform 0.1s, background 0.2s;
    }
    .copy-btn:hover  { background: #aa0000; }
    .copy-btn:active { transform: scale(0.97); }
    .copy-btn.copied { background: #22aa44; }
  </style>
</head>
